<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#2C2018" />
  <title>Join team — Get Bookking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand-dark: #2C2018;
      --brand-warm: #8B6F47;
      --brand-cream: #F5EDD8;
      --brand-offwhite: #FDFAF6;
      --brand-muted: #C9B8A0;
      --text-primary: #1A1410;
      --text-secondary: #6B5E4A;
      --text-tertiary: #9A8A7A;
      --border: #E8E0D4;
      --border-strong: #C9B8A0;
      --brand-wordmark-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --brand-wordmark-weight: 200;
      --brand-wordmark-tracking: 0.22em;
    }

    body {
      font-family: "DM Sans", system-ui, sans-serif;
      color: var(--text-primary);
      background:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(245, 237, 216, 0.95) 0%, transparent 55%),
        linear-gradient(180deg, var(--brand-offwhite) 0%, #ffffff 55%, var(--brand-cream) 100%);
      min-height: 100vh;
      padding: 28px 16px 56px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .shell {
      max-width: 440px;
      margin: 0 auto;
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
      padding-top: 8px;
    }

    .brand-wordmark {
      display: inline-block;
      font-family: var(--brand-wordmark-font);
      font-weight: var(--brand-wordmark-weight);
      font-size: 0.95rem;
      letter-spacing: var(--brand-wordmark-tracking);
      text-transform: uppercase;
      color: var(--brand-dark);
      text-decoration: none;
      line-height: 1.2;
    }

    .brand-tag {
      margin-top: 10px;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--brand-warm);
    }

    .card {
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px 22px 24px;
      box-shadow:
        0 1px 2px rgba(44, 32, 24, 0.04),
        0 12px 40px rgba(44, 32, 24, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    h1 {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.85rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--brand-dark);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .sub {
      font-size: 0.92rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      font-family: inherit;
      color: var(--text-primary);
      background: #fff;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input::placeholder { color: var(--brand-muted); }

    input:focus {
      outline: none;
      border-color: var(--brand-warm);
      box-shadow: 0 0 0 3px rgba(139, 111, 71, 0.18);
    }

    #lastName { text-transform: none; }

    .field-margin { margin-bottom: 14px; }

    .input-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrap input {
      flex: 1;
      min-width: 0;
      padding-right: 44px;
    }

    .toggle-visibility {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      padding: 8px;
      cursor: pointer;
      color: var(--text-tertiary);
      line-height: 0;
      border-radius: 8px;
    }

    .toggle-visibility:hover { color: var(--brand-warm); }
    .toggle-visibility:active { background: var(--brand-cream); }

    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-primary {
      background: var(--brand-dark);
      color: var(--brand-cream);
    }

    .btn-primary:hover:not(:disabled) {
      background: #3d2e22;
    }

    .btn-primary:active:not(:disabled) {
      transform: scale(0.985);
    }

    .btn-primary:disabled {
      background: var(--brand-muted);
      color: #fff;
      cursor: not-allowed;
    }

    .err {
      color: #b42318;
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .ok {
      color: var(--brand-warm);
      margin-top: 4px;
      font-weight: 500;
      font-family: "Instrument Serif", Georgia, serif;
      font-size: 1.25rem;
    }

    .muted {
      font-size: 0.82rem;
      color: var(--text-tertiary);
      margin-top: 14px;
    }

    .footer-note {
      text-align: center;
      margin-top: 22px;
      font-size: 0.78rem;
      color: var(--text-tertiary);
    }

    .footer-note a {
      color: var(--brand-warm);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-note a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <a class="brand-wordmark" href="https://getbookking.com" rel="noopener noreferrer">Get Bookking</a>
      <p class="brand-tag">Your business, fully booked.</p>
    </header>
    <div class="card" id="app">
    <h1 id="title">Join team</h1>
    <p class="sub" id="subtitle">Create your account to accept this invite.</p>
    <div id="formBlock">
      <label for="firstName">First name</label>
      <input class="field-margin" id="firstName" type="text" autocomplete="given-name" placeholder="First name" />
      <label for="lastName">Last name</label>
      <input class="field-margin" id="lastName" type="text" autocomplete="family-name" autocapitalize="words" placeholder="Last name" />
      <label for="phone">Phone</label>
      <input class="field-margin" id="phone" type="tel" autocomplete="tel" inputmode="numeric" placeholder="(555) 123-4567" maxlength="14" />
      <label for="email">Email</label>
      <input class="field-margin" id="email" type="email" autocomplete="username" placeholder="you@example.com" />
      <label for="password">Password</label>
      <div class="input-wrap field-margin">
        <input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" />
        <button type="button" class="toggle-visibility" id="togglePassword" aria-label="Show password" title="Show password">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <label for="password2">Confirm password</label>
      <div class="input-wrap field-margin">
        <input id="password2" type="password" autocomplete="new-password" placeholder="Re-enter password" />
        <button type="button" class="toggle-visibility" id="togglePassword2" aria-label="Show confirm password" title="Show password">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="button" class="btn btn-primary" id="btnCreateAccount">Create account</button>
      <div class="err" id="errMsg" style="display:none;"></div>
    </div>
    <div id="successBlock" style="display:none;">
      <p class="ok" id="successText">You’re on the team. Opening the app…</p>
      <p class="muted">If nothing happens, install Get Bookking from the App Store.</p>
    </div>
  </div>
    <p class="footer-note">
      Powered by <a href="https://getbookking.com" rel="noopener noreferrer">Get Bookking</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
  <!-- Always load config from Firebase Hosting origin (works on join.*, apex /join, and web.app). -->
  <script src="https://test-app-96812.web.app/js/firebase-config.js"></script>
  <script>
    (function () {
      /** After join: App Store or marketing URL (replace with your App Store link when published). */
      var APP_REDIRECT_URL = "https://getbookking.com";

      var params = new URLSearchParams(window.location.search);
      var token = (params.get("t") || "").trim().toLowerCase();
      var errEl = document.getElementById("errMsg");
      var formBlock = document.getElementById("formBlock");
      var successBlock = document.getElementById("successBlock");

      function showErr(msg) {
        errEl.style.display = "block";
        errEl.textContent = msg || "Something went wrong.";
      }
      function clearErr() {
        errEl.style.display = "none";
        errEl.textContent = "";
      }

      /** Human-readable message from Firebase callable errors. */
      function callableErrorMessage(e, fallback) {
        if (!e) return fallback || "Something went wrong.";
        if (typeof e.details === "string" && e.details.trim()) return e.details.trim();
        if (e.message) {
          var msg = String(e.message);
          var colon = msg.lastIndexOf(": ");
          if (colon >= 0 && colon < msg.length - 2) return msg.slice(colon + 2).trim();
          return msg.trim();
        }
        return fallback || "Something went wrong.";
      }

      /** Title-case each word (e.g. van der berg → Van Der Berg). */
      function titleCaseWords(s) {
        return s
          .trim()
          .split(/\s+/)
          .map(function (w) {
            return w ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : "";
          })
          .filter(Boolean)
          .join(" ");
      }

      function phoneDigits(s) {
        return (s || "").replace(/\D/g, "");
      }

      /** US display (xxx) xxx-xxxx — first 10 digits. */
      function formatPhoneUS(el) {
        var d = phoneDigits(el.value).slice(0, 10);
        var out = "";
        if (d.length === 0) out = "";
        else if (d.length <= 3) out = "(" + d;
        else if (d.length <= 6) out = "(" + d.slice(0, 3) + ") " + d.slice(3);
        else out = "(" + d.slice(0, 3) + ") " + d.slice(3, 6) + "-" + d.slice(6);
        el.value = out;
      }

      function isValidEmail(email) {
        if (!email || email.indexOf("@") < 1) return false;
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      }

      function wirePasswordToggle(btnId, inputId) {
        var btn = document.getElementById(btnId);
        var input = document.getElementById(inputId);
        if (!btn || !input) return;
        btn.addEventListener("click", function () {
          var show = input.type === "password";
          input.type = show ? "text" : "password";
          btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
          btn.setAttribute("title", show ? "Hide password" : "Show password");
        });
      }

      if (!/^[a-f0-9]{64}$/.test(token)) {
        var rawT = (params.get("t") || "").trim();
        document.getElementById("subtitle").textContent = rawT
          ? "This invite link looks incomplete or was cut off. In the app, tap Copy link and open the full URL."
          : "This invite link is missing the token. Ask your manager to send the link again using Copy link.";
        formBlock.style.display = "none";
        return;
      }

      document.getElementById("phone").addEventListener("input", function () {
        formatPhoneUS(this);
      });
      wirePasswordToggle("togglePassword", "password");
      wirePasswordToggle("togglePassword2", "password2");

      firebase.initializeApp(firebaseConfig);
      var auth = firebase.auth();
      var fns = firebase.app().functions("us-central1");
      var preview = fns.httpsCallable("getTenantInvitePreview");
      var accept = fns.httpsCallable("acceptTenantInvite");

      preview({ token: token })
        .then(function (res) {
          var name = (res.data && res.data.businessName) || "this business";
          var jobTitle = (res.data && res.data.jobTitle) || "";
          document.getElementById("title").textContent = "Join " + name;
          var roleLine = jobTitle
            ? "You’ll join as " + jobTitle + ". "
            : "";
          document.getElementById("subtitle").textContent =
            roleLine + "All fields are required. Create your account to join " + name + " on Get Bookking.";
        })
        .catch(function (e) {
          document.getElementById("subtitle").textContent = callableErrorMessage(
            e,
            "This invite is invalid, expired, or was already used."
          );
          formBlock.style.display = "none";
        });

      function joinPayload() {
        return {
          token: token,
          firstName: document.getElementById("firstName").value.trim(),
          lastName: document.getElementById("lastName").value.trim(),
          phone: document.getElementById("phone").value.trim(),
        };
      }

      function afterAuth() {
        clearErr();
        var payload = joinPayload();
        var u = auth.currentUser;
        var fn = payload.firstName;
        var ln = payload.lastName;
        return u
          .updateProfile({ displayName: fn + " " + ln })
          .then(function () {
            return accept(payload);
          })
          .then(function () {
            formBlock.style.display = "none";
            successBlock.style.display = "block";
            setTimeout(function () {
              window.location.href = APP_REDIRECT_URL;
            }, 1200);
          })
          .catch(function (e) {
            showErr(callableErrorMessage(e, "Could not accept invite."));
          });
      }

      document.getElementById("btnCreateAccount").onclick = function () {
        clearErr();
        var fn = document.getElementById("firstName").value.trim();
        var lnRaw = document.getElementById("lastName").value.trim();
        var ln = titleCaseWords(lnRaw);
        document.getElementById("lastName").value = ln;

        if (!fn) {
          showErr("Enter your first name.");
          return;
        }
        if (!ln) {
          showErr("Enter your last name.");
          return;
        }
        var phEl = document.getElementById("phone");
        formatPhoneUS(phEl);
        var pd = phoneDigits(phEl.value);
        if (pd.length !== 10) {
          showErr("Enter a complete US phone number: (555) 123-4567.");
          return;
        }
        var email = document.getElementById("email").value.trim();
        if (!isValidEmail(email)) {
          showErr("Enter a valid email with @ and a domain (e.g. you@example.com).");
          return;
        }
        var password = document.getElementById("password").value;
        var password2 = document.getElementById("password2").value;
        if (!password) {
          showErr("Enter a password.");
          return;
        }
        if (password.length < 6) {
          showErr("Password must be at least 6 characters.");
          return;
        }
        if (password !== password2) {
          showErr("Passwords do not match.");
          return;
        }

        auth
          .createUserWithEmailAndPassword(email, password)
          .then(afterAuth)
          .catch(function (e) {
            showErr(e.message || "Sign-up failed.");
          });
      };
    })();
  </script>
</body>
</html>
