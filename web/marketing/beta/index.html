<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beta — Get Bookking</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/brand/favicon-32.png?v=13" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/admin.css?v=3" />
  <style>
    .beta-page { max-width: 640px; margin: 0 auto; padding: 32px 20px 48px; }
    .beta-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 28px; }
    .beta-header h1 { font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; font-weight: 400; }
  </style>
</head>
<body class="admin-body">
  <script>
    if (/\.html$/i.test(location.pathname)) {
      location.replace(location.pathname.replace(/\.html$/i, '') + location.search + location.hash);
    }
  </script>
  <div class="beta-page" id="betaApp">
    <div class="admin-loading">Loading…</div>
  </div>

  <script src="/js/firebase-config.js"></script>
  <script src="/assets/portal-origins.js?v=1"></script>
  <script src="/assets/beta.js?v=2"></script>
  <script src="/assets/firebase-loader.js?v=1"></script>
  <script>
    BetaPortal.requireTester().then(function (ctx) {
      renderPortal(ctx);
    }).catch(function (err) {
      document.getElementById('betaApp').innerHTML =
        '<div class="admin-error">' + BetaPortal.escapeHtml(BetaPortal.callableMessage(err)) + '</div>' +
        '<p style="margin-top:12px"><a class="admin-btn" href="' + BetaPortal.loginUrl('/beta') + '">Sign in</a></p>';
    });

    function renderPortal(ctx) {
      var settings = (ctx.portal && ctx.portal.settings) || {};
      var user = ctx.user;
      var tf = settings.testflightPublicJoinUrl || window.testflightPublicJoinUrl || '';
      var signupUrl = (window.PortalOrigins && window.PortalOrigins.absoluteUrl)
        ? window.PortalOrigins.absoluteUrl('marketing', '/signup?beta=1')
        : '/signup?beta=1';

      document.getElementById('betaApp').innerHTML =
        '<div class="beta-header">' +
          '<div>' +
            '<div class="admin-brand" style="margin-bottom:12px;padding:0">' +
              '<img src="/assets/brand/logo-dark-128.png?v=12" alt="" width="36" height="36" />' +
              '<div class="admin-brand-text">Get Bookking</div>' +
              '<span class="admin-pill">Beta</span>' +
            '</div>' +
            '<h1>You&rsquo;re in the beta</h1>' +
            '<p class="admin-subtitle">Signed in as ' + BetaPortal.escapeHtml(user.email) + '</p>' +
          '</div>' +
          '<button type="button" class="admin-btn" id="betaSignOut">Sign out</button>' +
        '</div>' +
        '<section class="admin-panel">' +
          '<h2 style="font-size:16px;margin-bottom:10px">Next steps</h2>' +
          '<ol class="admin-list-meta" style="line-height:1.7;padding-left:18px;margin:0 0 16px">' +
            '<li>Install the app from TestFlight</li>' +
            '<li>Finish business setup at signup (same email)</li>' +
            '<li>Send feedback through TestFlight or email us</li>' +
          '</ol>' +
          (tf
            ? '<p style="margin-bottom:12px"><a class="admin-btn admin-btn--primary" href="' + BetaPortal.escapeHtml(tf) + '" target="_blank" rel="noopener">Open TestFlight</a></p>'
            : '<p class="admin-list-meta" style="margin-bottom:12px">TestFlight link will appear here once available.</p>') +
          '<p style="margin-bottom:12px"><a class="admin-btn" href="' + BetaPortal.escapeHtml(signupUrl) + '">Finish business setup</a></p>' +
          '<p class="admin-list-meta">Questions or feedback? Email <a href="mailto:' + BetaPortal.escapeHtml(settings.contactEmail || 'support@getbookking.com') + '">' +
            BetaPortal.escapeHtml(settings.contactEmail || 'support@getbookking.com') + '</a></p>' +
        '</section>';

      document.getElementById('betaSignOut').addEventListener('click', function () {
        ctx.fb.auth.signOut().then(function () {
          location.href = BetaPortal.loginUrl();
        });
      });
    }
  </script>
</body>
</html>
